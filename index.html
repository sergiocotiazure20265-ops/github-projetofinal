<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Git Tags</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17202a;
            --muted: #61707d;
            --accent: #e85d3f;
            --accent-dark: #b9432c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 15%, rgba(232, 93, 63, 0.18), transparent 28%),
                linear-gradient(135deg, #f7f2e9 0%, #e4edf0 100%);
            font-family: Georgia, "Times New Roman", serif;
        }

        body::before {
            position: fixed;
            inset: 1rem;
            z-index: -1;
            border: 1px solid rgba(23, 32, 42, 0.08);
            content: "";
            pointer-events: none;
        }

        h1,
        p {
            margin: 0;
        }

        h1 {
            max-width: 10ch;
            font-size: clamp(3rem, 10vw, 6.5rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
        }

        h1::after {
            display: block;
            width: 4rem;
            height: 0.35rem;
            margin-top: 1.5rem;
            border-radius: 999px;
            background: var(--accent);
            content: "";
        }

        body > p {
            width: min(100%, 42rem);
            margin-top: 1.5rem;
            padding-left: 1.25rem;
            border-left: 2px solid var(--accent);
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--muted);
        }

        body > p:first-of-type {
            margin-top: 2rem;
            color: var(--ink);
            font-size: clamp(1.2rem, 3vw, 1.7rem);
            line-height: 1.35;
        }

        body > p:last-of-type {
            margin-top: 2.5rem;
            padding: 0;
            border: 0;
            color: var(--accent-dark);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem;
            }

            body::before {
                inset: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <h1>Sistema de Clientes</h1>

    <p>Versão inicial do sistema.</p>

    <p>Autor: Sergio Mendes</p>
    <p>Treinamento github</p>

</body>

</html>
